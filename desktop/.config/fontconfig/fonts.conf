<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>PingFang SC</family>
    </prefer>
  </alias>
	<match target="scan">
		<test name="family">
			<string>Yahei Consolas Hybrid</string>
		</test>
		<edit name="spacing">
			<int>100</int>
		</edit>
	</match>
</fontconfig>
